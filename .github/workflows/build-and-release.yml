name: Build and Release

on:
  push:
    branches:
      - "**" # Trigger on all branches
    tags:
      - "v*" # Trigger on version tags

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  actions: read

jobs:
  build-windows:
    name: Build Windows ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
            package: QGroundControl-installer-AMD64

          - os: windows-11-arm
            host: windows_arm64
            arch: win64_msvc2022_arm64
            package: QGroundControl-installer-ARM64

          # TODO: Remove qt_version override once aqtinstall supports Qt 6.10.1+ for cross-compiled ARM64
          # Workaround: Pin to Qt 6.10.0 until aqtinstall fix is released
          # Tracking: https://github.com/miurahr/aqtinstall/pull/952
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_arm64_cross_compiled
            package: QGroundControl-installer-AMD64-ARM64
            qt_version: '6.10.0'

    defaults:
      run:
        shell: cmd

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get build config
        id: config
        uses: ./.github/actions/build-config

      - name: Common setup
        uses: ./.github/actions/common

      - name: Install GStreamer
        if: matrix.arch == 'win64_msvc2022_64'
        shell: pwsh
        run: |
          ./tools/setup/install-dependencies-windows.ps1 `
            -GStreamerVersion ${{ steps.config.outputs.gstreamer_windows_version }} `
            -SkipVulkan

      - name: Setup cache
        uses: ./.github/actions/cache
        with:
          host: ${{ matrix.host }}
          target: ${{ matrix.arch }}
          build-type: Release
          cpm-modules: ${{ runner.temp }}\build\cpm_modules
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Install Qt ${{ matrix.qt_version || steps.config.outputs.qt_version }}
        uses: ./.github/actions/qt-install
        with:
          version: ${{ matrix.qt_version || steps.config.outputs.qt_version }}
          host: ${{ matrix.host }}
          arch: ${{ matrix.arch }}
          modules: ${{ steps.config.outputs.qt_modules }}

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ (matrix.arch == 'win64_msvc2022_64' && 'x64') || (matrix.arch == 'win64_msvc2022_arm64' && 'arm64') || 'amd64_arm64' }}

      - name: Configure
        working-directory: ${{ runner.temp }}\build
        run: |
          ${{ env.QT_ROOT_DIR }}\bin\qt-cmake -S ${{ github.workspace }} -B . -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DQGC_STABLE_BUILD=${{ (github.ref_type == 'tag' || contains(github.ref, 'Stable')) && 'ON' || 'OFF' }} ^
            -DQGC_ENABLE_GST_VIDEOSTREAMING=${{ matrix.arch == 'win64_msvc2022_64' && 'ON' || 'OFF' }} ^
            -DQT_HOST_PATH=${{ (matrix.arch == 'win64_msvc2022_arm64_cross_compiled') && format('{0}\\..\\msvc2022_64', env.QT_ROOT_DIR) || '' }}

      - name: Build
        working-directory: ${{ runner.temp }}\build
        run: cmake --build . --target all --config Release --parallel

      - name: Verify Executable
        if: matrix.arch != 'win64_msvc2022_arm64_cross_compiled'
        working-directory: ${{ runner.temp }}\build\Release
        run: QGroundControl.exe --simple-boot-test

      - name: Create Installer
        working-directory: ${{ runner.temp }}\build
        run: cmake --install . --config Release

      - name: Upload Windows artifact
        uses: ./.github/actions/upload
        with:
          artifact_name: ${{ matrix.package }}.exe
          package_name: ${{ matrix.package }}
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_distribution_id: ${{ secrets.AWS_DISTRIBUTION_ID }}
          upload_aws: ${{ matrix.arch == 'win64_msvc2022_arm64_cross_compiled' && 'false' || 'true' }}

  build-macos:
    name: Build macOS Universal
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: true

      - name: Get build config
        id: config
        uses: ./.github/actions/build-config

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.config.outputs.xcode_version }}

      - name: Install Dependencies (include GStreamer)
        working-directory: ${{ github.workspace }}/tools/setup
        env:
          GSTREAMER_VERSION: ${{ steps.config.outputs.gstreamer_macos_version }}
        run: sh install-dependencies-macos.sh

      - name: Setup Caching
        uses: ./.github/actions/cache
        with:
          host: mac
          target: clang_64
          build-type: Release
          cpm-modules: ${{ runner.temp }}/build/cpm_modules
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Install Qt
        uses: ./.github/actions/qt-install
        with:
          version: ${{ steps.config.outputs.qt_version }}
          host: mac
          arch: clang_64
          modules: ${{ steps.config.outputs.qt_modules }}

      - name: CMake configure
        working-directory: ${{ runner.temp }}/build
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DQGC_STABLE_BUILD=${{ github.ref_type == 'tag' || contains(github.ref, 'Stable') && 'ON' || 'OFF' }}
              -DQGC_MACOS_SIGN_WITH_IDENTITY=OFF

      - name: Build
        working-directory: ${{ runner.temp }}/build
        run: cmake --build . --target all --config Release --parallel

      - name: Create app bundle
        working-directory: ${{ runner.temp }}/build
        run: cmake --install . --config Release

      - name: Upload macOS artifact
        uses: ./.github/actions/upload
        with:
          artifact_name: QGroundControl.dmg
          package_name: QGroundControl
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_distribution_id: ${{ secrets.AWS_DISTRIBUTION_ID }}

  build-linux:
    name: Build Linux ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            package: QGroundControl-x86_64
            host: linux
            arch: linux_gcc_64

          - os: ubuntu-24.04-arm
            package: QGroundControl-aarch64
            host: linux_arm64
            arch: linux_gcc_arm64

    defaults:
      run:
        shell: bash

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get build config
        id: config
        uses: ./.github/actions/build-config

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Install Dependencies
        run: |
          chmod a+x ./tools/setup/install-dependencies-debian.sh
          sudo ./tools/setup/install-dependencies-debian.sh

      - name: Setup Caching
        uses: ./.github/actions/cache
        with:
          host: ${{ matrix.host }}
          target: ${{ matrix.arch }}
          build-type: Release
          cpm-modules: ${{ runner.temp }}/build/cpm_modules
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Install Qt for Linux
        uses: ./.github/actions/qt-install
        with:
          version: ${{ steps.config.outputs.qt_version }}
          host: ${{ matrix.host }}
          arch: ${{ matrix.arch }}
          modules: ${{ steps.config.outputs.qt_modules }}

      - name: Configure
        working-directory: ${{ runner.temp }}/build
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DQGC_BUILD_TESTING=OFF
              -DQGC_STABLE_BUILD=${{ github.ref_type == 'tag' || contains(github.ref, 'Stable') && 'ON' || 'OFF' }}

      - name: Build
        working-directory: ${{ runner.temp }}/build
        run: cmake --build . --target all --config Release --parallel

      - name: Verify Executable
        working-directory: ${{ runner.temp }}/build/Release
        run: xvfb-run -a ./QGroundControl --simple-boot-test

      - name: Create AppImage
        working-directory: ${{ runner.temp }}/build
        run: cmake --install . --config Release

      - name: Verify AppImage
        working-directory: ${{ runner.temp }}/build
        run: xvfb-run -a ./${{ matrix.package }}.AppImage --simple-boot-test

      - name: Upload Linux artifact
        uses: ./.github/actions/upload
        with:
          artifact_name: ${{ matrix.package }}.AppImage
          package_name: ${{ matrix.package }}
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_distribution_id: ${{ secrets.AWS_DISTRIBUTION_ID }}

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/QGroundControl-installer-AMD64/QGroundControl-installer-AMD64.exe
            artifacts/QGroundControl-installer-ARM64/QGroundControl-installer-ARM64.exe
            artifacts/QGroundControl-installer-AMD64-ARM64/QGroundControl-installer-AMD64-ARM64.exe
            artifacts/QGroundControl/QGroundControl.dmg
            artifacts/QGroundControl-x86_64/QGroundControl-x86_64.AppImage
            artifacts/QGroundControl-aarch64/QGroundControl-aarch64.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
